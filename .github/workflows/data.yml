name: data
on:
  workflow_dispatch:
    inputs:
      validate:
        description: "Also run the daily check now"
        type: boolean
        default: false
permissions:
  contents: read
env:
  AWS_ACCESS_KEY_ID: ${{ secrets.S_ID }}
  AWS_SECRET_ACCESS_KEY: ${{ secrets.S_SECRET }}
  AWS_DEFAULT_REGION: auto
  AWS_REQUEST_CHECKSUM_CALCULATION: when_required
  AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
  ENGINE_KEY: ${{ secrets.ENGINE_KEY }}
  E: ${{ secrets.S_ENDPOINT }}
  B: ${{ secrets.S_BUCKET }}
  P: ${{ secrets.S_PREFIX }}
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    concurrency:
      group: data
      cancel-in-progress: false
    outputs:
      daily: ${{ steps.when.outputs.daily }}
    steps:
      - id: when
        run: echo "daily=$([ "$(date -u +%H%M)" \< "0015" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
      - name: Load
        run: aws s3 cp "s3://$B/${P}state.json" state.json --endpoint-url "$E" --only-show-errors || echo "first run"
      - name: Fetch
        run: node run.js
      - name: Funds
        run: node run.js etf || echo "funds skipped"
      - name: Save
        run: |
          aws s3 cp state.json "s3://$B/${P}state.json" --endpoint-url "$E" --only-show-errors --content-type application/json --cache-control "no-store"
          aws s3 cp live.json "s3://$B/${P}live.json" --endpoint-url "$E" --only-show-errors --content-type application/json --cache-control "public, max-age=60"
          aws s3 cp signals.json "s3://$B/${P}signals.json" --endpoint-url "$E" --only-show-errors --content-type application/json --cache-control "public, max-age=60"
          aws s3 cp rules.json "s3://$B/${P}rules.json" --endpoint-url "$E" --only-show-errors --content-type application/json --cache-control "public, max-age=60"
          aws s3 cp brief.json "s3://$B/${P}brief.json" --endpoint-url "$E" --only-show-errors --content-type application/json --cache-control "public, max-age=60"
          [ ! -f etf.json ] || aws s3 cp etf.json "s3://$B/${P}etf.json" --endpoint-url "$E" --only-show-errors --content-type application/json --cache-control "public, max-age=600"
  check:
    needs: run
    if: ${{ !cancelled() && (needs.run.outputs.daily == 'true' || inputs.validate) }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    concurrency:
      group: check
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
      - name: Check
        run: node run.js validate
      - name: Save
        run: aws s3 cp validation.json "s3://$B/${P}validation.json" --endpoint-url "$E" --only-show-errors --content-type application/json --cache-control "public, max-age=300"
