name: backtest
# checkcoin backtests (backtest/run.js = current alert rules v2, backtest/v3.js = other kinds of
# signal, backtest/v4.js = breakout + volume event by event). Read-only on the market: no secrets, no R2. Writes only its own reports back to this branch
# (backtest/out/) so they can be read without the Actions UI; a GITHUB_TOKEN push does not re-trigger.
on:
  push:
    branches: [claude/stoic-faraday-wlyhkm]
    paths: ["backtest/*.js", "backtest/engine/**", ".github/workflows/backtest.yml"]
  workflow_dispatch: {}
permissions:
  contents: write
concurrency:
  group: backtest
  cancel-in-progress: true
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
      - name: Current rules (v2)
        run: node backtest/run.js
      - name: Other kinds of signal (v3)
        if: always()
        run: node backtest/v3.js
      - name: Breakout + volume deep dive (v4)
        if: always()
        run: node backtest/v4.js
      - name: Save the reports on this branch
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f backtest/out/*.md backtest/out/*.json || true
          git commit -m "backtest: reports $(date -u +%F)" || exit 0
          git push
